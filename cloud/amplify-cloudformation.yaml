AWSTemplateFormatVersion: "2010-09-09"Description: >  Challenge TYA Tierra y Armonía - Data Engineering Pipeline  Despliegue en AWS Amplify para el dashboard interactivo de calidad de datos.# ============================================================# PARÁMETROS# ============================================================Parameters:  AppName:    Type: String    Default: challenge-tya-tierra-armonia    Description: Nombre de la aplicación en Amplify  Repository:    Type: String    Description: >      URL del repositorio Git (ej: https://github.com/tu-usuario/challenge-tya).      Si se deja vacío, se configura para deploy manual via ZIP.    Default: ""  Branch:    Type: String    Default: main    Description: Rama del repositorio a desplegar  OAuthToken:    Type: String    NoEcho: true    Default: ""    Description: >      GitHub Personal Access Token para conectar el repositorio.      Dejar vacío para deploy manual.  EnvironmentType:    Type: String    Default: PRODUCTION    AllowedValues:      - PRODUCTION      - STAGING    Description: Tipo de entorno# ============================================================# CONDICIONES# ============================================================Conditions:  HasRepository: !Not [!Equals [!Ref Repository, ""]]  HasOAuthToken: !Not [!Equals [!Ref OAuthToken, ""]]  UseGitDeploy: !And    - !Condition HasRepository    - !Condition HasOAuthToken# ============================================================# RECURSOS# ============================================================Resources:  # ── Amplify App ──  AmplifyApp:    Type: AWS::Amplify::App    Properties:      Name: !Ref AppName      Description: >        Challenge TYA Tierra y Armonía - Pipeline de calidad de datos.        Dashboard interactivo con validación de esquemas, caché inteligente,        detección de diferencias y corrección de datos.      # Configuración condicional del repositorio      Repository: !If [UseGitDeploy, !Ref Repository, !Ref "AWS::NoValue"]      OauthToken: !If [UseGitDeploy, !Ref OAuthToken, !Ref "AWS::NoValue"]      # Build specification      BuildSpec: |        version: 1        frontend:          phases:            preBuild:              commands:                - cd frontend                - npm ci            build:              commands:                - npm run build          artifacts:            baseDirectory: frontend/dist            files:              - '**/*'          cache:            paths:              - frontend/node_modules/**/*      # Variables de entorno      EnvironmentVariables:        - Name: VITE_APP_NAME          Value: "Challenge TYA Tierra y Armonía"        - Name: VITE_APP_VERSION          Value: "2.0.0"        - Name: _LIVE_UPDATES          Value: '[{"name":"Node.js version","pkg":"node","type":"nvm","version":"18"}]'      # Reglas de redirección para SPA      CustomRules:        - Source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>"          Target: /index.html          Status: "200"        - Source: /          Target: /index.html          Status: "200"      # Headers de seguridad      CustomHeaders: |        customHeaders:          - pattern: '**/*'            headers:              - key: 'Strict-Transport-Security'                value: 'max-age=31536000; includeSubDomains'              - key: 'X-Content-Type-Options'                value: 'nosniff'              - key: 'X-Frame-Options'                value: 'DENY'              - key: 'X-XSS-Protection'                value: '1; mode=block'              - key: 'Referrer-Policy'                value: 'strict-origin-when-cross-origin'      Tags:        - Key: Project          Value: challenge-tya        - Key: Environment          Value: !Ref EnvironmentType        - Key: Team          Value: data-engineering  # ── Branch (solo con Git) ──  AmplifyBranch:    Type: AWS::Amplify::Branch    Condition: UseGitDeploy    Properties:      AppId: !GetAtt AmplifyApp.AppId      BranchName: !Ref Branch      EnableAutoBuild: true      Stage: !If [!Equals [!Ref EnvironmentType, "PRODUCTION"], "PRODUCTION", "DEVELOPMENT"]      EnvironmentVariables:        - Name: VITE_ENVIRONMENT          Value: !Ref EnvironmentType# ============================================================# OUTPUTS# ============================================================Outputs:  AppId:    Description: ID de la aplicación Amplify    Value: !GetAtt AmplifyApp.AppId    Export:      Name: !Sub "${AppName}-AppId"  DefaultDomain:    Description: Dominio por defecto de Amplify    Value: !Sub "https://${Branch}.${AmplifyApp.DefaultDomain}"    Condition: UseGitDeploy  AppArn:    Description: ARN de la aplicación    Value: !GetAtt AmplifyApp.Arn  ConsoleUrl:    Description: URL de la consola de Amplify    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/amplify/home#/d/${AmplifyApp.AppId}"  ManualDeployCommand:    Description: Comando para deploy manual (sin Git)    Value: !Sub >      cd frontend && npm run build &&      zip -r ../deploy.zip dist/ &&      aws amplify create-deployment --app-id ${AmplifyApp.AppId} --branch-name main