AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Challenge TYA Tierra y Armonia - Data Engineering Pipeline
  AWS Amplify deployment for the interactive data quality dashboard.

Parameters:
  AppName:
    Type: String
    Default: challenge-tya-git-deploy
    Description: Name of the Amplify application
  Repository:
    Type: String
    Description: GitHub repository URL (e.g., https://github.com/user/repo)
  Branch:
    Type: String
    Default: main
    Description: Git branch to deploy
  OAuthToken:
    Type: String
    NoEcho: true
    Description: GitHub Personal Access Token for repository access
  EnvironmentType:
    Type: String
    Default: PRODUCTION
    AllowedValues:
      - PRODUCTION
      - STAGING

Conditions:
  IsProduction: !Equals [!Ref EnvironmentType, "PRODUCTION"]

Resources:
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Ref AppName
      Repository: !Ref Repository
      OauthToken: !Ref OAuthToken
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - cd frontend
                - npm ci
            build:
              commands:
                - npm run build
          artifacts:
            baseDirectory: frontend/dist
            files:
              - '**/*'
          cache:
            paths:
              - frontend/node_modules/**/*
      EnvironmentVariables:
        - Name: VITE_APP_NAME
          Value: "Challenge TYA Tierra y Armonia"
        - Name: VITE_APP_VERSION
          Value: "2.0.0"
        - Name: _LIVE_UPDATES
          Value: '[{"name":"Node.js version","pkg":"node","type":"nvm","version":"20"}]'
      CustomRules:
        - Source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>"
          Target: /index.html
          Status: "200"
        - Source: /
          Target: /index.html
          Status: "200"
      Tags:
        - Key: Project
          Value: challenge-tya
        - Key: Environment
          Value: !Ref EnvironmentType

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref Branch
      EnableAutoBuild: true
      Stage: !If [IsProduction, "PRODUCTION", "DEVELOPMENT"]
      EnvironmentVariables:
        - Name: VITE_ENVIRONMENT
          Value: !Ref EnvironmentType

Outputs:
  AppId:
    Description: Amplify App ID
    Value: !GetAtt AmplifyApp.AppId
  DefaultDomain:
    Description: Default Amplify domain
    Value: !Sub "https://${Branch}.${AmplifyApp.DefaultDomain}"
  ConsoleUrl:
    Description: Amplify Console URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/amplify/home#/d/${AmplifyApp.AppId}"